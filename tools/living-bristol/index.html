<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penny Empire — Living Bristol asset preview</title><link rel="stylesheet" href="../../src/design/tokens.css"><style>body{background:var(--pe-bg);color:var(--pe-text);font:16px system-ui;margin:24px}button,select,input{font:inherit;min-height:44px;background:var(--pe-surface);color:var(--pe-text);border:1px solid var(--pe-divider);padding:0 12px}h1{color:var(--pe-accent);font-size:24px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.scroll{overflow:auto}canvas{image-rendering:pixelated;display:block}p{max-width:900px}a{color:var(--pe-accent)}</style><h1>Penny Empire — Living Bristol</h1><p>Art integration fixture. Tier switching, dynamic company labels, state indicators and directional vehicle movement. No economic simulation. Characters remain idle; rejected walk-cycle artwork is excluded.</p><div class="controls"><label>Building tier <select id="tier"><option>1</option><option>2</option><option>3</option></select></label><label>Company name <input id="name" maxlength="32" value="Mad:slices"></label><label>Colour <select id="colour"><option value="#FFC45E">Amber</option><option value="#62DBAF">Mint</option><option value="#70AFC4">Blue</option></select></label><button id="pause">Pause motion</button></div><div class="scroll"><canvas width="1400" height="1100" id="world" aria-label="Bristol asset fixture with six industries"></canvas></div><p id="status">Loading…</p><p><a href="../../docs/art/phase2/qa/building-tiers.png">Building progression contact sheet</a></p><script type="module">
import{terrain,project,drawSprite}from'../art-review/renderer.js';import{drawCompanyLabel,drawState}from'./overlays.js';
const manifest=await fetch('../../assets/art/phase2/manifest.json').then(r=>r.json());const images={};await Promise.all([...new Set(manifest.assets.map(a=>a.source))].map(async s=>{const im=new Image();im.src='../../'+s;await im.decode();images[s]=im;}));const assets={manifest,images};const animations=(await fetch('../../assets/art/phase2/animations.json').then(r=>r.json())).animations;const stateImages={};await Promise.all(animations.map(async a=>{const im=new Image();im.src='../../'+a.file;await im.decode();stateImages[a.id]=im;}));
const ctx=document.querySelector('#world').getContext('2d');let paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0;const controls=['tier','name','colour'].map(id=>document.getElementById(id));document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume motion':'Pause motion';};
function render(now){if(!paused&&last)time+=Math.min(100,now-last);last=now;ctx.fillStyle='#17252a';ctx.fillRect(0,0,1400,1100);for(let r=0;r<10;r++)for(let c=0;c<10;c++){const[x,y]=project(c,r);terrain(ctx,700+x,290+y,c===9?'water':r===8?'road':'paving',r===8?5:0);}const tier=controls[0].value;const entities=[['farm',0,0],['mill',3,0],['dairy',6,0],['timber',0,4],['cafe',3,4],['pizza',6,4]];
for(const[id,c,r]of entities.sort((a,b)=>a[1]+a[2]-b[1]-b[2])){const[x,y]=project(c+1,r+1);drawSprite(ctx,assets,id+'-t'+tier,700+x,290+y+32);drawCompanyLabel(ctx,{name:id==='pizza'?controls[1].value:id,tier:+tier,x:700+x,y:290+y+60,colour:controls[2].value,selected:id==='pizza'});const a=animations.find(a=>a.id===(id==='mill'?'production':id==='pizza'?'high-demand':'success'));drawState(ctx,stateImages[a.id],a,700+x+50,290+y+58,time,paused);}
const p=(time/1800)%8;const[x,y]=project(p,8);drawSprite(ctx,assets,'delivery-van-se',700+x,290+y+32);const[ax,ay]=project(5,7);drawSprite(ctx,assets,'owner-sw',700+ax,290+ay+32);requestAnimationFrame(render);}requestAnimationFrame(render);document.querySelector('#status').textContent='67 sprite entries loaded; 10 state strips. No unapproved walk frames used.';
</script></html>
